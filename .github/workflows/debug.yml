name: Build Debug APK

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install SDK Platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-37.0" > /dev/null || sdkmanager "platforms;android-37" > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0

      - name: Fix Line Endings and Grant Execute Permission for Gradlew
        run: |
          sed -i -e 's/\r$//' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: zuiFont-Debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
